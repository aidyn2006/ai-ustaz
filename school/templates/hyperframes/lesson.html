<!doctype html>
<html lang="{{ lesson.language }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #f8fafc;
        background: radial-gradient(circle at 20% 20%, #1e3a8a 0%, #0f172a 60%);
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 160px;
        text-align: center;
      }
      .eyebrow { font-size: 40px; color: #93c5fd; letter-spacing: 0.08em; text-transform: uppercase; }
      .title { margin-top: 32px; font-size: 104px; font-weight: 700; line-height: 1.1; }
      .meta { margin-top: 40px; font-size: 36px; color: #cbd5e1; }
      .num { font-size: 160px; font-weight: 800; color: #38bdf8; line-height: 1; }
      .point { margin-top: 36px; font-size: 80px; font-weight: 600; line-height: 1.2; max-width: 1500px; }
      .bar { margin-top: 48px; width: 240px; height: 10px; border-radius: 5px; background: #38bdf8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lesson" data-start="0" data-duration="{{ total }}" data-width="1920" data-height="1080">
      <section id="s-intro" class="scene clip" data-start="0" data-duration="{{ intro }}" data-track-index="0">
        <div class="eyebrow">{{ lesson.subject }} · {{ lesson.classroom }}</div>
        <div class="title">{{ lesson.title }}</div>
        <div class="meta">AI Ustaz</div>
      </section>
      {% for s in scenes %}
      <section id="s-{{ forloop.counter }}" class="scene clip" data-start="{{ s.start }}" data-duration="{{ per_point }}" data-track-index="0">
        <div class="num">{{ forloop.counter }}</div>
        <div class="point">{{ s.text }}</div>
        <div class="bar"></div>
      </section>
      {% endfor %}
      <section id="s-outro" class="scene clip" data-start="{{ outro_start }}" data-duration="{{ outro }}" data-track-index="0">
        <div class="title">{{ outro_text }}</div>
        <div class="bar"></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const starts = {{ starts_json|safe }};
      document.querySelectorAll(".scene").forEach((scene, i) => {
        const kids = scene.children;
        tl.fromTo(kids, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.15, ease: "power3.out" }, starts[i] + 0.1);
        tl.to(kids, { opacity: 0, duration: 0.4 }, starts[i + 1] - 0.45);
      });
      window.__timelines["lesson"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
